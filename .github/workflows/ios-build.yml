name: iOS build

# Compiles the iMessage app (no signing) whenever it changes, so a broken project is caught before it reaches Xcode.
on:
  push:
    paths:
      - 'imessage/**'
      - 'src/generator.js'
      - 'data/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for the simulator
        run: |
          xcodebuild -project imessage/Coil.xcodeproj -scheme Coil -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
      - name: Build for iPhone (release, unsigned)
        run: |
          xcodebuild -project imessage/Coil.xcodeproj -scheme Coil -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
      - name: Check the bundles
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*Release-iphoneos/Coil.app' -maxdepth 6 | head -1)
          ls "$APP" "$APP/PlugIns/CoilMessages.appex"
          test -f "$APP/PlugIns/CoilMessages.appex/coil.js"
          test -f "$APP/PlugIns/CoilMessages.appex/puzzles.js"
          plutil -p "$APP/PlugIns/CoilMessages.appex/Info.plist" | grep -A3 NSExtension
